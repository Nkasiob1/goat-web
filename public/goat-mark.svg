<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="coin" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#E6C77A"/>
      <stop offset="55%" stop-color="#C9A24A"/>
      <stop offset="100%" stop-color="#9A7428"/>
    </radialGradient>
    <clipPath id="face"><circle cx="60" cy="60" r="49"/></clipPath>
  </defs>

  <!-- coin body -->
  <circle cx="60" cy="60" r="57" fill="url(#coin)"/>
  <circle cx="60" cy="60" r="57" fill="none" stroke="#8A6722" stroke-width="2"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#B48F3E" stroke-width="1.5"/>

  <!-- green veins: two flowing leaf-veins hugging the inner rim -->
  <g clip-path="url(#face)" fill="none" stroke="#2F6B4C" stroke-linecap="round" opacity="0.75">
    <path d="M56 104 C 38 102, 24 90, 19 72 C 17 64, 18 56, 21 49" stroke-width="1.3"/>
    <path d="M33 97 C 31 92, 32 88, 35 85 M24 84 C 25 79, 28 76, 31 75 M19 66 C 22 63, 25 62, 28 62" stroke-width="0.9"/>
    <path d="M64 104 C 82 102, 96 90, 101 72 C 103 64, 102 56, 99 49" stroke-width="1.3"/>
    <path d="M87 97 C 89 92, 88 88, 85 85 M96 84 C 95 79, 92 76, 89 75 M101 66 C 98 63, 95 62, 92 62" stroke-width="0.9"/>
  </g>

  <!-- goat head -->
  <g fill="#1F4D36" stroke="#1F4D36" stroke-linecap="round" stroke-linejoin="round">
    <!-- horns -->
    <path d="M53 42 C 46 30, 36 26, 30 32 C 28 35, 31 38, 34 36" fill="none" stroke-width="5"/>
    <path d="M67 42 C 74 30, 84 26, 90 32 C 92 35, 89 38, 86 36" fill="none" stroke-width="5"/>
    <!-- ears -->
    <path d="M48 50 C 40 47, 33 50, 30 55 C 37 57, 44 56, 49 54 Z" stroke-width="1"/>
    <path d="M72 50 C 80 47, 87 50, 90 55 C 83 57, 76 56, 71 54 Z" stroke-width="1"/>
    <!-- face -->
    <path d="M47 46 Q 60 38 73 46 L 69 76 Q 60 85 51 76 Z" stroke-width="1"/>
    <!-- beard -->
    <path d="M56.5 81 L 60 93 L 63.5 81 Z" stroke-width="1"/>
  </g>
  <!-- eyes and nostrils in gold -->
  <ellipse cx="54" cy="56" rx="2.4" ry="1.6" fill="#E6C77A"/>
  <ellipse cx="66" cy="56" rx="2.4" ry="1.6" fill="#E6C77A"/>
  <circle cx="57" cy="74" r="1.1" fill="#C9A24A"/>
  <circle cx="63" cy="74" r="1.1" fill="#C9A24A"/>
</svg>
